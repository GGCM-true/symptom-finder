  .dx-link:hover{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-deep)}

  .dept-notes{font-size:12.5px;color:var(--ink-2);line-height:1.8;background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .dept-notes b{color:var(--teal-deep);font-weight:500}

</style>

<script>
(function(){
  "use strict";
  var D = TRIAGE_DATA;
  var L = D.levels;

  /* ---------- 基础工具 ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function norm(s){return String(s||"").trim().toLowerCase().replace(/\s+/g,"");}
  function stripParen(s){return String(s).replace(/[（(].*?[)）]/g,"").trim();}

  /* ---------- 统计 ---------- */
  var depMap = D.deptKeys || {};
  function keyOf(deptName){
    if(!deptName) return null;
    var n = stripParen(deptName).replace(/\s+/g,"");
    if(depMap[n]) return depMap[n];
    // 名字含“/”或多院区名时做双向包含匹配（如「心身医学中心 / 四川省精神医学中心」）
    var mk;
    for(mk in depMap){
      if(n.length>1 && depMap[mk] && mk.length>1 && (n.indexOf(mk)>-1 || mk.indexOf(n)>-1)) return depMap[mk];
    }
    // 兜底：逐科室做包含匹配
    for(var i=0;i<D.departments.length;i++){
      var dn = D.departments[i].name;
      if(dn && (n.indexOf(dn)>-1 || dn.indexOf(n)>-1 && dn.indexOf("/")===-1)) return D.departments[i].key;
    }
    return null;
  }
  function linkDepts(entry){
    var keys = {};
    var k = keyOf(entry.dept); if(k) keys[k]=1;
    (entry.alts||[]).forEach(function(a){ var k2=keyOf(a); if(k2) keys[k2]=1; });
    return keys;
  }

  // 每个科室：关联症状
  var deptEntries = {};
  D.departments.forEach(function(dp){ deptEntries[dp.key]=[]; });
  D.entries.forEach(function(en){
    var ks = linkDepts(en);
    Object.keys(ks).forEach(function(kk){ if(deptEntries[kk]) deptEntries[kk].push(en); });
  });

  var hotWords = ["发烧","肚子疼","咳嗽","胸痛","拉肚子","头痛","失眠","牙痛","皮疹","腰痛","月经不调","反酸烧心"];

  /* ---------- 渲染辅助 ---------- */
  function lvClass(l){ return "lv-"+l; }
  function pillHtml(entry){
    var lv = L[entry.level];
    var pop = (entry.population && entry.population!=="通用") ? '<span class="pop-tag">'+esc(entry.population)+'</span>' : '';
    var cat = '<span class="cat-tag">'+esc(entry.cat)+'</span>';
    return '<div class="c-tags"><span class="pill '+lvClass(entry.level)+'">'+esc(lv.label)+'</span><span class="lvline">'+esc(lv.hint)+'</span>'+pop+cat+'</div>';
  }

  function entryCard(en, matchedKw){
    var html = '';
    html += '<div class="card" id="e-'+esc(en.id)+'">';
    html += '<div class="c-top"><div><div class="c-name">'+esc(en.name)+'</div>'+
            '<div class="c-meta">'+(matchedKw?'命中关键词「'+esc(matchedKw)+'」→ 标准症状名「'+esc(en.name)+'」':'标准症状名：'+esc(en.name))+'</div></div>'+
            pillHtml(en)+'</div>';

    html += '<div class="seg"><div class="seg-t">可能的专业诊断方向<span class="seg-hint">点按可反查关联症状</span></div><div class="dx-list">'+
            (en.diagnoses||[]).map(function(d){return '<button type="button" class="dx" data-dx="'+esc(d)+'">'+esc(d)+'</button>';}).join('')+'</div></div>';

    html += '<div class="seg"><div class="seg-t">建议挂号科室</div><div class="dept-main">'+
            '<div class="dm-label">首诊</div><div><div class="dm-name">'+esc(en.dept)+'</div>'+
            (en.deptNote?'<div class="dm-note">'+esc(en.deptNote)+'</div>':'')+'</div></div>';
    if(en.alts && en.alts.length){
      html += '<div class="alts-line"><b>备选 / 转诊：</b>'+en.alts.map(esc).join(' · ')+'</div>';
    }
    html += '</div>';

    html += '<div class="seg"><div class="seg-t">疾病科普</div><div class="science"><p>'+esc(en.science)+'</p></div></div>';

    if(en.tips && en.tips.length){
      html += '<div class="seg"><div class="seg-t">就诊提示</div><ul class="tips">'+en.tips.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>';
    }
    if(en.redline){
      html += '<div class="seg redline"><div class="rl-t">急诊红线 · 出现以下情况请立即就医</div>'+esc(en.redline)+'</div>';
    }
    html += '</div>';
    return html;
  }

  /* ---------- 搜索 ---------- */
  function searchEntries(q){
    var n = norm(q);
    if(!n) return {list:[], kw:null};
    var out = [];
    D.entries.forEach(function(en){
      var pool = [en.name].concat(en.keywords||[]).concat(en.diagnoses||[]);
      for(var i=0;i<pool.length;i++){
        var pn = norm(pool[i]);
        if(pn && (pn.indexOf(n)>-1 || n.indexOf(pn)>-1)){
          out.push({en:en, kw:pool[i], score: score(en,i,pn,n)});
          return;
        }
      }
    });
    out.sort(function(a,b){return b.score-a.score;});
    return {list:out, kw:q.trim()};
  }
  function score(en, idx, pn, n){
    var s = 0;
    if(pn===n) s += 100;           // 完全等于
    if(norm(en.name)===n) s += 50; // 命中主名
    if(idx===1) s += 20;           // 命中同义词
    if(pn.indexOf(n)===0) s += 10; // 前缀命中
    return s + (n.length/pn.length)*5;
  }

  var resultsEl = document.getElementById("results");
  function renderResults(items, rawQ){
    if(!items.length){
      resultsEl.innerHTML = '<div class="no-result"><b>没有搜到「'+esc(rawQ)+'」的条目。</b><br>'
        +'试试换一种说法（如「肚子疼」→「腹痛」）、选择右侧热门标签，或直接到「科室浏览」页按科室查看。'
        +'<div class="hint-btns">'
        + hotWords.slice(0,8).map(function(w){return '<span class="chip" data-w="'+esc(w)+'">'+esc(w)+'</span>';}).join('')
        +'</div></div>';
      return;
    }
    var head = '<div class="result-head"><span class="tt">查询「'+esc(rawQ)+'」</span><span class="cnt">共 '+items.length+' 条</span></div>';
    resultsEl.innerHTML = head + items.map(function(it){return entryCard(it.en, it.kw);}).join('');
  }

  /* ---------- 建议下拉 ---------- */
  var sugEl = document.getElementById("suggest");
  function showSuggest(q){
    var res = searchEntries(q);
    if(!res.list.length){ sugEl.className="suggest"; return; }
    var html = res.list.slice(0,8).map(function(it){
      var lv = L[it.en.level];
      return '<div class="sg-item" data-name="'+esc(it.en.name)+'"><span class="sg-kw">'+esc(it.kw)+'</span>'+esc(it.en.name)+'<span class="sg-sub">'+esc(lv.label)+' · '+esc(it.en.dept)+'</span></div>';
    }).join('');
    sugEl.innerHTML = html;
    sugEl.className = "suggest show";
  }

  function doSearch(q){
    var rawQ = (q!=null?q:String(document.getElementById("q").value));
    var res = searchEntries(rawQ);
    renderResults(res.list, rawQ);
    sugEl.className="suggest";
    switchTo("search");
  }

  /* ---------- 热门标签 / 事件绑定 ---------- */
  function bindChips(container, cb){
    container.addEventListener("click", function(ev){
      var t = ev.target;
      var d = t.getAttribute && t.getAttribute("data-w");
      if(d){ cb(d); }
      else if(t.parentNode && t.parentNode.getAttribute && t.parentNode.getAttribute("data-w")){
        cb(t.parentNode.getAttribute("data-w"));
      }
    });
  }
  document.getElementById("chips").innerHTML = hotWords.map(function(w){return '<span class="chip" data-w="'+esc(w)+'">'+esc(w)+'</span>';}).join('');
  bindChips(document.getElementById("chips"), function(w){
    document.getElementById("q").value = w;
    doSearch(w);
    window.scrollTo({top:document.getElementById("viewSearch").offsetTop-8, behavior:"smooth"});
  });

  var qEl = document.getElementById("q");
  var debTimer=null;
  qEl.addEventListener("input", function(){
    var v = this.value;
    clearTimeout(debTimer);
    debTimer = setTimeout(function(){ v ? showSuggest(v) : (sugEl.className="suggest"); }, 120);
  });
  qEl.addEventListener("focus", function(){ if(this.value) showSuggest(this.value); });
  document.addEventListener("click", function(ev){
    if(!sugEl.contains(ev.target) && ev.target!==qEl) sugEl.className="suggest";
  });
  sugEl.addEventListener("click", function(ev){
    var item = ev.target.closest ? ev.target.closest(".sg-item") : null;
    if(!item){ var t=ev.target; if(t && t.className && String(t.className).indexOf("sg-item")>-1) item=t; }
    if(!item) return;
    var name = item.getAttribute("data-name");
    document.getElementById("q").value = name;
    var res = searchEntries(name);
    renderResults(res.list, name);
    sugEl.className="suggest";
  });
  qEl.addEventListener("keydown", function(ev){
    if(ev.key==="Enter"){ ev.preventDefault(); doSearch(); }
  });
  document.getElementById("btnSearch").addEventListener("click", function(){ doSearch(); });

  // 结果区/无结果提示里的热门 chips 委托
  bindChips(resultsEl, function(w){
    document.getElementById("q").value = w;
    doSearch(w);
  });

  /* ---------- 诊断反查（点诊断词 → 列出库中所有关联症状） ---------- */
  function dxBase(s){ return norm(stripParen(s)); }
  function dxHit(en, nb){
    // 命中条件：诊断名/症状名/同义词 去掉括号注释后与目标名 相等 或 双向包含
    var arr, i, b;
    var pools = [ [en.name], en.keywords||[], en.diagnoses||[] ];
    for(var p=0;p<pools.length;p++){
      arr = pools[p];
      for(i=0;i<arr.length;i++){
        b = dxBase(arr[i]);
        if(!b) continue;
        if(b===nb) return true;
        if(nb.length>=2 && b.length>=2 && (b.indexOf(nb)>-1 || nb.indexOf(b)>-1)) return true;
      }
    }
    return false;
  }
  function lvDot(l){ return l==="red"?"d-dot":(l==="yellow"?"y-dot":"g-dot"); }

  var ov = document.getElementById("dxOverlay");
  var dxBody = document.getElementById("dxBody");
  function closeDx(){ ov.className = "overlay"; }
  function openDx(dxText){
    var nb = dxBase(dxText);
    var hits = [];
    if(nb){ hits = D.entries.filter(function(en){ return dxHit(en, nb); }); }
    var html = '<div class="dx-t">'+esc(dxText)+'</div>'+
               '<div class="dx-sub">该诊断在导诊知识库中可能与以下症状相互关联（点按跳转到对应卡片）；无标记项为「待排查」方向参考。</div>';
    if(hits.length){
      html += '<div class="dx-sec"><div class="dx-sec-t">关联症状 · 共 '+hits.length+' 条（'+esc(dxText)+' 会在这些主诉中被考虑）</div><div class="dx-links">'+
              hits.map(function(en){
                return '<button type="button" class="dx-link" data-id="'+esc(en.id)+'" data-name="'+esc(en.name)+'">'+
                       '<span class="dx-dot '+lvDot(en.level)+'"></span>'+esc(en.name)+'</button>';
              }).join('')+'</div></div>';
      var depts = [], seen = {};
      hits.forEach(function(en){ var d=stripParen(en.dept); if(d&&!seen[d]){seen[d]=1;depts.push(en.dept);} });
      if(depts.length){
        html += '<div class="dx-sec"><div class="dx-sec-t">就医科室提示</div>'+
                '<div class="dept-notes"><b>建议首诊：</b>'+depts.slice(0,4).map(esc).join(' · ')+'</div></div>';
      }
    }else{
      html += '<div class="dx-sec"><div class="dx-empty">当前库中暂无其他症状条目直接关联「'+esc(dxText)+'」。<br>该诊断仅作为本条目的可能方向之一，请以医生面诊为准；也可尝试在顶部搜索框输入症状名反向查找。</div></div>';
    }
    html += '<div class="dx-sec" style="font-size:11.5px;color:var(--ink-3);margin-top:16px">以上为科普参考与分诊学习用途，不能替代医生诊断。</div>';
    dxBody.innerHTML = html;
    ov.className = "overlay show";
  }
  function jumpToEntry(id, name){
    closeDx();
    switchTo("search");
    doSearch(name);
    setTimeout(function(){
      var el = document.getElementById("e-"+id);
      if(el){
        el.scrollIntoView({behavior:"smooth", block:"start"});
        el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
      }
    }, 60);
  }
  // 结果卡片里的诊断按钮（事件委托）
  resultsEl.addEventListener("click", function(ev){
    var el = ev.target.closest ? ev.target.closest(".dx") : null;
    if(el && el.getAttribute("data-dx")) openDx(el.getAttribute("data-dx"));
  });
  // 弹层内部：点关联症状跳转 / 关闭
  dxBody.addEventListener("click", function(ev){
    var el = ev.target.closest ? ev.target.closest(".dx-link") : null;
    if(el && el.getAttribute("data-id") && el.getAttribute("data-name")){
      jumpToEntry(el.getAttribute("data-id"), el.getAttribute("data-name"));
    }
  });
  document.getElementById("dxClose").addEventListener("click", closeDx);
  ov.addEventListener("click", function(ev){ if(ev.target===ov) closeDx(); });
  document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") closeDx(); });

  /* ---------- 科室浏览 ---------- */
  var groups = ["内科","外科","妇产儿科","五官口腔皮肤","急诊与中心"];
  var deptListEl = document.getElementById("deptList");
  function renderDepts(){
    var html = "";
    groups.forEach(function(g){
      var dps = D.departments.filter(function(dp){return dp.group===g;});
      if(!dps.length) return;
      html += '<div class="grp"><div class="grp-t">'+g+'</div><div class="grp-cards">';
      dps.forEach(function(dp){
        var list = deptEntries[dp.key] || [];
        html += '<div class="dpt"><div class="dn">'+esc(dp.name)+'</div><div class="di">'+esc(dp.intro)+'</div><div class="links">';
        if(list.length){
          list.forEach(function(en){
            html += '<button class="mini-chip" data-w="'+esc(en.name)+'">'+esc(en.name)+'</button>';
          });
        }else{
          html += '<span class="mini-empty">暂无导诊条目，可直接挂该科门诊</span>';
        }
        html += '</div></div>';
      });
      html += '</div></div>';
    });
    deptListEl.innerHTML = html;
    document.getElementById("deptStat").textContent = "共收录科室/门诊 "+D.departments.length+" 个，症状导诊条目 "+D.entries.length+" 条（点击某科下的症状可跳转查询）。";
  }
  // mini-chip 按钮独立绑定（避免与上方通用委托重复触发）
  deptListEl.addEventListener("click", function(ev){
    var t = ev.target;
    if(t && t.tagName==="BUTTON" && t.className==="mini-chip" && t.getAttribute("data-w")){
      var w = t.getAttribute("data-w");
      document.getElementById("q").value = w;
      doSearch(w);
      window.scrollTo({top:0, behavior:"smooth"});
    }
  });

  /* ---------- Tab 切换 ---------- */
  function switchTo(view){
    document.getElementById("viewSearch").style.display = view==="search" ? "" : "none";
    document.getElementById("viewDepts").style.display = view==="depts" ? "" : "none";
    document.getElementById("tabSearch").className = "tab"+(view==="search"?" on":"");
    document.getElementById("tabDepts").className = "tab"+(view==="depts"?" on":"");
  }
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      switchTo(t.getAttribute("data-view"));
      if(t.getAttribute("data-view")==="depts") renderDepts();
    });
  });

  /* ---------- 点击头部品牌区返回首页 ---------- */
  function goHome(){
    switchTo("search");
    document.getElementById("q").value = "";
    var demo = searchEntries("发烧");
    renderResults(demo.list, "发烧");
    window.scrollTo({top:0, behavior:"smooth"});
  }
  document.getElementById("brandHome").addEventListener("click", goHome);

  /* ---------- 首屏 ---------- */
  function init(){
    var nE = D.entries.length, nD = D.departments.length;
    document.getElementById("statline").innerHTML = "共收录 <b>"+nE+"</b> 条症状导诊条目 · 覆盖 <b>"+nD+"</b> 个科室/门诊（数据更新："+esc(D.meta.updated)+"，参考医院官网科室公示）";
    document.getElementById("footMeta").textContent = "科室与门诊名称整理自四川省人民医院官网（samsph.cn）科室公示（2026-09 核对），共 " + nD + " 个科室/门诊、" + nE + " 条导诊记录；如需调整或补充，直接编辑 data.js 中的 entries / departments 数组即可。";
    // 默认展示一个示例结果，帮助理解用法
    var demo = searchEntries("发烧");
    renderResults(demo.list, "发烧");
    document.getElementById("q").value = "";
  }
  init();
})();
</script>
</body>
</html>
